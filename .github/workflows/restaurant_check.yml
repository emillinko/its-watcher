
name: ITS Kenpo Restaurant Check

on:
  workflow_dispatch:

concurrency:
  group: its-kenpo-restaurant-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run restaurant check
        env:
          ITS_KENPO_URL: ${{ secrets.ITS_KENPO_URL }}
          DISCORD_WEBHOOK_URL_PRIVATE: ${{ secrets.DISCORD_WEBHOOK_URL_PRIVATE }}
        run: node restaurant_check.js

      - name: Save notification history
        if: always()
        run: |
          if [ -f sakura_notified.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add sakura_notified.json

            if ! git diff --cached --quiet; then
              git commit -m "Update Sakura restaurant notification history"

              # 作業中の変更を一時退避
              git stash push --include-untracked -m "temporary changes"

              # 最新のGitHub側の変更を取得
              git pull --rebase origin main

              # 履歴をGitHubに保存
              git push origin main

              # 一時退避した変更を戻す
              git stash pop || true
            fi
          fi

