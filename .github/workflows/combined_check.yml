
name: ITS Kenpo Combined Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch facility and restaurant checks
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT が設定されていません"
            exit 1
          fi

          echo "ホテル・全施設チェックを起動します"
          gh workflow run all_check_fast4.yml --ref main

          echo "桜華樓チェックを起動します"
          gh workflow run restaurant_check.yml --ref main

          echo "両方のチェックを起動しました"
