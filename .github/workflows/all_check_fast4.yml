
name: ITS Kenpo All Check Fast 4

on:
  workflow_dispatch:

# 同じワークフローの同時実行を防止
concurrency:
  group: its-kenpo-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ==========================================
      # GitHubからコード取得
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # Node.js
      # ==========================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==========================================
      # npm
      # ==========================================
      - name: Install dependencies
        run: npm install

      # ==========================================
      # Playwright
      # ==========================================
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # ==========================================
      # PAUL通知履歴の初期化
      # ==========================================
      - name: Initialize PAUL notification history
        run: |
          if [ ! -f paul_notified.json ]; then
            echo '{"updated_at":"","slots":[]}' > paul_notified.json
          fi

      # ==========================================
      # ITS健保 指定2施設チェック
      # ==========================================
      - name: Run original vacancy check
        env:
          ITS_KENPO_URL: ${{ secrets.ITS_KENPO_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_PRIVATE: ${{ secrets.DISCORD_WEBHOOK_URL_PRIVATE }}
        run: node check.js

      # ==========================================
      # ITS健保 全施設 Fast4チェック
      # ==========================================
      - name: Run fast4 vacancy check
        env:
          ITS_KENPO_URL: ${{ secrets.ITS_KENPO_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_PRIVATE: ${{ secrets.DISCORD_WEBHOOK_URL_PRIVATE }}
        run: node all_check_fast4.js

      # ==========================================
      # PAUL四谷 空きチェック
      # ==========================================
      - name: Run PAUL Yotsuya vacancy check
        if: always()
        env:
          DISCORD_WEBHOOK_URL_PRIVATE: ${{ secrets.DISCORD_WEBHOOK_URL_PRIVATE }}
        run: node paul_check.js

      # ==========================================
      # 通知履歴を安全にGitHubへ保存
      # ==========================================
      - name: Save notification histories
        if: always()
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f notified.json paul_notified.json

          if git diff --cached --quiet; then
            echo "通知履歴に変更なし"
            exit 0
          fi

          git commit -m "Update vacancy notification histories"

          # 最大3回まで競合解決とPushを試行
          for attempt in 1 2 3; do
            echo "================================"
            echo "保存試行: ${attempt}/3"
            echo "================================"

            git fetch origin main

            # 最新mainに追従
            if ! git rebase origin/main; then

              echo "競合を検出。通知履歴を統合します。"

              conflicts=$(git diff --name-only --diff-filter=U)

              # ITS健保・PAULの履歴を個別に統合
              for file in notified.json paul_notified.json; do

                if printf '%s\n' "$conflicts" | grep -Fxq "$file"; then

                  echo "統合中: $file"

                  node - "$file" <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const file = process.argv[2];

          const upstream = JSON.parse(
            execFileSync("git", ["show", `:2:${file}`], {
              encoding: "utf8"
            })
          );

          const local = JSON.parse(
            execFileSync("git", ["show", `:3:${file}`], {
              encoding: "utf8"
            })
          );

          let merged;

          if (file === "notified.json") {
            // ITS健保：両方の通知履歴を保持
            merged = {
              ...upstream,
              ...local
            };

          } else {
            // PAUL：更新日時が新しい履歴を採用
            const upstreamTime = Date.parse(
              upstream.updated_at || ""
            ) || 0;

            const localTime = Date.parse(
              local.updated_at || ""
            ) || 0;

            const latest =
              localTime >= upstreamTime
                ? local
                : upstream;

            merged = {
              updated_at: latest.updated_at || "",
              slots: Array.isArray(latest.slots)
                ? [...new Set(latest.slots)]
                : []
            };
          }

          fs.writeFileSync(
            file,
            JSON.stringify(merged, null, 2) + "\n",
            "utf8"
          );

          console.log(`${file} の統合完了`);
          NODE

                  git add "$file"

                fi
              done

              # 競合解決後、Rebaseを続行
              GIT_EDITOR=true git rebase --continue

            fi

            # GitHubへPush
            if git push origin HEAD:main; then
              echo "通知履歴の保存に成功しました！"
              exit 0
            fi

            echo "Push失敗。次の試行に進みます。"

          done

          echo "通知履歴の保存に3回失敗しました"
          exit 1
