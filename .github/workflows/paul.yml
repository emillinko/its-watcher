
name: PAUL Yotsuya Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Initialize notification history
        run: |
          if [ ! -f paul_notified.json ]; then
            echo '{"updated_at":"","slots":[]}' > paul_notified.json
          fi

      - name: Check PAUL Yotsuya
        env:
          DISCORD_WEBHOOK_URL_PRIVATE: ${{ secrets.DISCORD_WEBHOOK_URL_PRIVATE }}
        run: |
          node paul_check.js

      - name: Save notification history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add paul_notified.json

          if ! git diff --cached --quiet; then
            git commit -m "Update PAUL notification history"
            git push
          else
            echo "通知履歴に変更はありません"
          fi
