name: ITS Kenpo All Facilities Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Check URL secret
        env:
          ITS_KENPO_URL: ${{ secrets.ITS_KENPO_URL }}
        run: |
          if [ -n "$ITS_KENPO_URL" ]; then
            echo "ITS_KENPO_URL: 設定されています"
          else
            echo "ITS_KENPO_URL: 空です"
          fi

      - name: Run all facility check
        env:
          ITS_KENPO_URL: ${{ secrets.ITS_KENPO_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node all_check.js
      
      - name: LINE Test
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: node line_test.js
